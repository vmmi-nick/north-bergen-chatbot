<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Bergen Constituent Chatbot</title>
<style>
  :root{
    --burgundy:#6f1d2f; --burgundy-dark:#521423; --burgundy-ink:#4a1421;
    --gold:#c9a227; --gold-deep:#8a6d1a; --gold-soft:#f3e5bb; --gold-pale:#faf3dd;
    --bg:#f7f3ec; --panel:#ffffff; --panel-soft:#fbf8f2;
    --text:#26221f; --muted:#5f574f; --border:#e3d9c8;
    --shadow:0 1px 2px rgba(74,20,33,.06),0 8px 24px rgba(74,20,33,.07);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1c1715; --panel:#2a2320; --panel-soft:#241e1b;
      --text:#f2ece6; --muted:#c0b3a6; --border:#4a3f36;
      --gold-soft:#5c4d1e; --gold-pale:#33291a; --gold-deep:#d9b64a;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.55;-webkit-font-smoothing:antialiased;
    /* Sized with height:100% (the iframe's own height), never vh/dvh:
       viewport units inside an iframe can resolve against the host page's
       viewport (notably iOS Safari), which made this page taller than the
       frame and pushed the composer below the visible area. */
    display:flex;flex-direction:column;height:100%;overflow:hidden;
  }
  a{color:var(--burgundy)}
  @media (prefers-color-scheme: dark){ a{color:var(--gold-soft)} }
  :focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ---------- slim header ---------- */
  .topbar{
    flex:0 0 auto;
    background:var(--burgundy);color:#fff;border-bottom:3px solid var(--gold);
  }
  .topbar-in{
    padding:8px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .seal{
    flex:0 0 auto;width:30px;height:30px;border-radius:50%;
    border:2px solid var(--gold);color:var(--gold-soft);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-weight:700;font-size:.74rem;letter-spacing:.04em;
  }
  .brand-name{font-family:Georgia,serif;font-size:.92rem;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{display:block;font-family:inherit;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft)}
  .langtoggle{display:flex;background:var(--burgundy-dark);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px;flex:0 0 auto}
  .langbtn{
    border:0;background:transparent;color:#f3e5bb;border-radius:999px;
    padding:4px 11px;cursor:pointer;font:inherit;font-size:.8rem;
  }
  .langbtn.active{background:#fff;color:var(--burgundy);font-weight:600}
  .embed-note{
    flex:0 0 auto;padding:7px 12px;font-size:.78rem;color:#efe6d4;
    background:var(--burgundy-dark);border-bottom:1px solid rgba(255,255,255,.12);
  }

  /* ---------- scrolling message area ---------- */
  .chatwrap{
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    padding:14px 12px 10px;
    background:var(--panel-soft);
    -webkit-overflow-scrolling:touch;
  }
  #chat{display:flex;flex-direction:column;gap:12px}
  .msg{max-width:92%;padding:11px 14px;border-radius:14px;line-height:1.55;font-size:.95rem;overflow-wrap:break-word;white-space:pre-wrap}
  .msg.user{align-self:flex-end;background:var(--burgundy);color:#fff;border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(74,20,33,.05)}
  .msg.bot .lead{font-weight:600}
  .msg.bot ul{margin:8px 0 0;padding-left:20px}
  .msg.bot li{margin-top:3px}
  .contact{margin-top:12px;border-top:2px solid var(--gold);padding-top:8px;font-size:.92rem}
  .contact .ctitle{font-variant:small-caps;letter-spacing:.06em;color:var(--burgundy);font-weight:700}
  @media (prefers-color-scheme: dark){ .contact .ctitle{color:var(--gold-deep)} }
  .contact div{margin-top:3px}
  .source{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);font-size:.82rem;color:var(--muted)}

  /* ---------- suggestion chips ---------- */
  /* One horizontally scrolling row: wrapping these long chips previously
     stacked them into a ~324px block that crowded the composer out of
     short frames. */
  .tryrow{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:nowrap;padding:8px 12px;background:var(--bg)}
  .trylabel{font-size:.76rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-deep);flex:0 0 auto}
  .chips{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:2px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    background:var(--panel);border:1px solid var(--gold);color:var(--text);
    border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:.85rem;
    flex:0 0 auto;white-space:nowrap;
  }
  .chip:hover{background:var(--gold-pale)}

  /* ---------- report flow ---------- */
  .chip.report-chip{background:var(--burgundy);border-color:var(--burgundy);color:#fff;font-weight:600}
  .chip.report-chip:hover{background:var(--burgundy-dark)}
  .flowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip.chip-cancel{border-color:var(--border);color:var(--muted)}
  .msg.bot .rc-title{font-family:Georgia,serif;font-weight:700;font-size:1.02rem;color:var(--burgundy)}
  @media (prefers-color-scheme: dark){ .msg.bot .rc-title{color:var(--gold-soft)} }
  .report-rows{margin-top:8px}
  .report-rows div{margin-top:4px;white-space:pre-wrap}
  .rc-call{margin-top:12px;border-top:2px solid var(--gold);padding-top:8px}
  .rc-note{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);font-size:.9rem;color:var(--muted)}

  /* ---------- composer ---------- */
  .composer{
    flex:0 0 auto;
    background:var(--bg);border-top:1px solid var(--border);
    padding:8px 12px 10px;
  }
  form{display:flex;gap:8px;align-items:flex-end}
  textarea#q{
    flex:1;min-width:0;padding:10px 13px;border:1px solid var(--border);border-radius:16px;
    font:inherit;font-size:1rem;line-height:1.45;background:var(--panel);color:var(--text);box-shadow:var(--shadow);
    resize:none;overflow-y:hidden;min-height:54px;max-height:120px;
  }
  textarea#q::placeholder{color:var(--muted)}
  button.send{
    background:var(--burgundy);color:#fff;border:0;border-radius:999px;
    padding:12px 20px;cursor:pointer;font:inherit;font-size:1rem;font-weight:600;flex:0 0 auto;
  }
  button.send:hover{background:var(--burgundy-dark)}
  button.send:disabled{opacity:.55;cursor:default}

  /* ---------- voice (mic input + read-aloud) ---------- */
  .voicebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px}
  .voice-enc{font-size:.85rem;line-height:1.35;color:var(--muted)}
  button.mic{
    background:var(--panel);color:var(--burgundy);border:1px solid var(--gold);border-radius:999px;
    padding:10px 18px;cursor:pointer;flex:0 0 auto;font:inherit;font-size:1rem;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:var(--shadow);
  }
  button.mic:hover{background:var(--gold-pale)}
  button.mic svg{width:24px;height:24px;fill:currentColor;flex:0 0 auto}
  button.mic.listening{background:var(--burgundy);color:#fff;border-color:var(--burgundy);animation:micpulse 1.2s ease-in-out infinite}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(111,29,47,.45)}50%{box-shadow:0 0 0 12px rgba(111,29,47,0)}}
  @media (prefers-color-scheme: dark){
    button.mic{color:var(--gold-soft)}
    button.mic.listening{color:#fff}
  }
  .voicehint{display:none;font-size:.85rem;color:var(--gold-deep);font-weight:600;margin-top:8px}
  .voicehint.on{display:block}
  .voicemsg{display:none;font-size:.9rem;color:var(--burgundy);font-weight:600;margin-top:8px}
  .voicemsg.on{display:block}
  .speakbtn{
    margin-top:10px;background:var(--panel);border:1px solid var(--gold);color:var(--text);
    border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:.82rem;
    display:inline-flex;align-items:center;gap:6px;
  }
  .speakbtn:hover{background:var(--gold-pale)}
  .speakbtn svg{width:14px;height:14px;fill:currentColor;flex:0 0 auto}
  .speakbtn.speaking{background:var(--burgundy);border-color:var(--burgundy);color:#fff}

  /* ---------- short frames (small windows, landscape phones) ---------- */
  @media (max-height:540px){
    .embed-note{display:none}
    .brand-sub{display:none}
    .topbar-in{padding:6px 12px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="seal" aria-hidden="true">NB</span>
      <span class="brand-name"><span id="title">North Bergen Constituent Chatbot</span><span class="brand-sub">Township of North Bergen</span></span>
    </div>
    <div class="langtoggle" role="group" aria-label="Language / Idioma">
      <button class="langbtn active" id="btn-en" type="button" aria-pressed="true">English</button>
      <button class="langbtn" id="btn-es" type="button" aria-pressed="false">Español</button>
    </div>
  </div>
  <div class="embed-note" id="disclaimer">Guidance only, not official notice. In an emergency call 911. This chat does not collect personal information.</div>
</div>

<div class="chatwrap" id="chatwrap">
  <div id="chat" role="log" aria-live="polite" aria-label="Conversation"></div>
</div>

<div class="tryrow">
  <span class="trylabel" id="try-label">Try asking:</span>
  <div class="chips" id="chips"></div>
</div>

<div class="composer">
  <form id="askform">
    <label class="sr-only" for="q" id="q-label">Ask about township services</label>
    <textarea id="q" rows="2" autocomplete="off" placeholder="Ask about township services..."></textarea>
    <button class="send" id="sendbtn" type="submit">Ask</button>
  </form>
</div>

<script>

  var STR = {

          flooding: { label: 'Sewerage & Storm Systems (Township)', phone: '201-392-2128' },
          missed: { label: 'Public Works (DPW)', phone: '201-392-2071' },
          bulk: { label: 'Public Works (DPW)', phone: '201-392-2128' },
          illegal: { label: 'Police, non-emergency', phone: '201-392-2100' },
          weeds: { label: 'Health Department', phone: '201-392-2084' },
          noise: { label: 'Police, non-emergency', phone: '201-392-2100' },
          speeding: { label: 'Police, non-emergency', phone: '201-392-2100' },
          other: { label: 'Township Help Desk', phone: '201-875-9110' }
        },
        askAddress: 'What is the exact street address where the problem is? If it is at an intersection, give both street names.',
        askCross: 'What is the nearest cross street?',
        askPole: 'If the pole has a number marked on it, type it here. Tap Skip if there is no number or you do not know it.',
        askDesc: 'Briefly describe what is happening, and since when. For example: "The light has been out for three nights."',
        askContact: 'Optional: type your name and phone number if you want the department to call you back. It is only written into the summary you take with you; it is not sent anywhere. Tap Skip to leave it out.',
        skip: 'Skip',
        cancel: 'Cancel report',
        cancelled: 'Report stopped. Nothing was sent or saved.',
        typeRetry: 'Please tap one of the issue types above, or tap Cancel report to stop.',
        summaryTitle: 'Your prepared report',
        copyHead: 'Prepared report - Township of North Bergen',
        fIssue: 'Issue',
        fLocation: 'Location',
        fCross: 'Nearest cross street',
        fPole: 'Pole number',
        fDesc: 'Description',
        fContact: 'Name / phone',
        callLine: 'Call to file this report:',
        notSent: 'This assistant does not send or save your report. Call the number above and read or share this summary; your report is only filed once you contact the township.',
        copy: 'Copy summary',
        copied: 'Copied.',
        copyFail: 'Copy failed'
      }
    },
    es: {
      title: 'Chat para Residentes de North Bergen',
      disclaimer: 'Solo orientación, no es un aviso oficial. En una emergencia llame al 911. Este chat no recopila información personal.',
      placeholder: 'Pregunte sobre los servicios del municipio...', ask: 'Preguntar', contact: 'Contacto',
      source: 'Fuente', thinking: 'Consultando las fuentes del municipio...',
      tryLabel: 'Pruebe preguntar:',
      qLabel: 'Pregunte sobre los servicios del municipio',
      greeting: 'Hola. Puedo ayudarle a encontrar servicios del municipio, formularios, números de teléfono y fechas de reuniones. Hágame una pregunta o toque uno de los temas abajo.',
      chips: ['¿Cuándo es la próxima reunión de comisionados?', '¿Quién es el alcalde?', '¿Cómo consigo un espacio para discapacitados frente a mi casa?', '¿Cómo obtengo un acta de nacimiento?', 'Programas y transporte para personas mayores', 'Basura y reciclaje'],
      voice: { mic: 'Toque y hable', listening: 'Escuchando...', listen: 'Escuchar', stop: 'Detener', encourage: 'Sin escribir. Toque el micrófono, pregunte en voz alta y reciba su respuesta.', nohear: 'No escuché eso. Toque el micrófono e inténtelo de nuevo.', blocked: 'El acceso al micrófono está bloqueado. Permita el micrófono en los ajustes de su navegador, o escriba su pregunta.', network: 'El reconocimiento de voz necesita una conexión a internet.' },
      report: {

        types: [
          { key: 'pothole', label: 'Bache' },
          { key: 'streetlight', label: 'Luz de la calle apagada' },
          { key: 'flooding', label: 'Inundación o atasco de alcantarillado' },

          { key: 'weeds', label: 'Hierba alta o propiedad descuidada' },

          { key: 'speeding', label: 'Exceso de velocidad' },

        ],
        depts: {
          pothole: { label: 'Obras Públicas (DPW), reparaciones de calles', phone: '201-392-2128' },

          flooding: { label: 'Alcantarillado y Sistemas Pluviales (Municipio)', phone: '201-392-2128' },
          missed: { label: 'Obras Públicas (DPW)', phone: '201-392-2071' },
          bulk: { label: 'Obras Públicas (DPW)', phone: '201-392-2128' },
          illegal: { label: 'Policía, línea no urgente', phone: '201-392-2100' },
          weeds: { label: 'Departamento de Salud', phone: '201-392-2084' },
          noise: { label: 'Policía, línea no urgente', phone: '201-392-2100' },
          speeding: { label: 'Policía, línea no urgente', phone: '201-392-2100' },
          other: { label: 'Mesa de Ayuda del municipio', phone: '201-875-9110' }
        },
        askAddress: '¿Cuál es la dirección exacta donde está el problema? Si es en una intersección, dé los nombres de ambas calles.',
        askCross: '¿Cuál es la calle transversal más cercana?',
        askPole: 'Si el poste tiene un número marcado, escríbalo aquí. Toque Omitir si no hay número o no lo sabe.',

        skip: 'Omitir',
        cancel: 'Cancelar el reporte',
        cancelled: 'Reporte detenido. No se envió ni se guardó nada.',
        typeRetry: 'Toque uno de los tipos de problema de arriba, o toque Cancelar el reporte para detenerse.',
        summaryTitle: 'Su reporte preparado',
        copyHead: 'Reporte preparado - Municipio de North Bergen',
        fIssue: 'Problema',
        fLocation: 'Ubicación',
        fCross: 'Calle transversal más cercana',
        fPole: 'Número del poste',
        fDesc: 'Descripción',
        fContact: 'Nombre / teléfono',
        callLine: 'Llame para presentar este reporte:',
        notSent: 'Este asistente no envía ni guarda su reporte. Llame al número de arriba y lea o comparta este resumen; su reporte solo se registra cuando usted se comunica con el municipio.',
        copy: 'Copiar el resumen',
        copied: 'Copiado.',
        copyFail: 'No se pudo copiar'
      }
    }
  };
  var chat = document.getElementById('chat');
  var chatwrap = document.getElementById('chatwrap');
  var chipsEl = document.getElementById('chips');

  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  /* Wrap bare http/https URLs in ALREADY-ESCAPED text in new-tab anchors.
     Runs after esc(), and the match excludes quotes and angle brackets, so a
     URL can never break out of the href attribute. Plain-text fields only:
     never apply to HTML that already contains anchors. */
  function linkify(h){
    return h.replace(/https?:\/\/[^\s<"]+/g, function(u){
      return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';
    });
  }
  function scrollChat(){ chatwrap.scrollTop = chatwrap.scrollHeight; }
  function addUser(text){
    var div=document.createElement('div'); div.className='msg user'; div.textContent=text;
    chat.appendChild(div); scrollChat();
  }
  function addBot(data){
    var div=document.createElement('div'); div.className='msg bot';
    var html='<div class="lead">'+linkify(esc(data.lead||''))+'</div>';
    if (data.details && data.details.length){
      html+='<ul>'+data.details.map(function(d){return '<li>'+linkify(esc(d))+'</li>';}).join('')+'</ul>';
    }
    if (data.contact && data.contact.length){
      html+='<div class="contact"><div class="ctitle">'+esc(STR[lang].contact)+'</div>'+
        data.contact.map(function(c){
          var v = c.href ? '<a href="'+esc(c.href)+'"'+(c.href.indexOf('http')===0?' target="_blank" rel="noopener"':'')+'>'+esc(c.value)+'</a>' : linkify(esc(c.value));
          return '<div>'+esc(c.label)+': '+v+'</div>';
        }).join('')+'</div>';
    }
    if (data.source){
      html+='<div class="source">'+esc(STR[lang].source)+': <a href="'+esc(data.source)+'" target="_blank" rel="noopener">'+esc(data.sourceLabel||data.source)+'</a></div>';
    }
    div.innerHTML=html;
    if (voice.synthOK) attachSpeak(div, div.textContent.replace(/\s+/g,' ').trim(), data.lang);
    chat.appendChild(div); scrollChat();
  }
  function renderChips(){
    chipsEl.innerHTML='';
    var rb=document.createElement('button'); rb.type='button'; rb.className='chip report-chip'; rb.textContent=STR[lang].report.entryChip;
    rb.onclick=function(){ startReport(); };
    chipsEl.appendChild(rb);
    STR[lang].chips.forEach(function(c){
      var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=c;
      b.onclick=function(){ ask(c); };
      chipsEl.appendChild(b);
    });
  }
  function applyLang(){
    document.getElementById('title').textContent=STR[lang].title;
    document.getElementById('disclaimer').textContent=STR[lang].disclaimer;
    document.getElementById('q').placeholder=STR[lang].placeholder;
    document.getElementById('q-label').textContent=STR[lang].qLabel;
    document.getElementById('sendbtn').textContent=STR[lang].ask;
    document.getElementById('try-label').textContent=STR[lang].tryLabel;
    document.getElementById('btn-en').classList.toggle('active', lang==='en');
    document.getElementById('btn-es').classList.toggle('active', lang==='es');
    document.getElementById('btn-en').setAttribute('aria-pressed', lang==='en' ? 'true' : 'false');
    document.getElementById('btn-es').setAttribute('aria-pressed', lang==='es' ? 'true' : 'false');
    document.documentElement.lang = lang;
    if (voice.micBtn){
      voice.micBtn.setAttribute('aria-label', STR[lang].voice.mic);
      var micLabel=voice.micBtn.querySelector('.mic-label');
      if (micLabel) micLabel.textContent=STR[lang].voice.mic;
    }
    if (voice.enc) voice.enc.textContent=STR[lang].voice.encourage;
    if (voice.hint) voice.hint.textContent = STR[lang].voice.listening;
    renderChips();
  }
  /* ---------- guided report flow (prepare mode) ----------
     Client-side only: the flow assembles a summary in the chat for the
     resident to call in. Nothing is sent, saved or stored anywhere. */
  var reportState = null;
  function R(){ return STR[lang].report; }
  function normText(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
  function addFlowMsg(text, buttons){
    var div=document.createElement('div'); div.className='msg bot';
    div.innerHTML='<div class="lead">'+esc(text)+'</div>';
    if (buttons && buttons.length){
      var row=document.createElement('div'); row.className='flowbtns';
      buttons.forEach(function(b){
        var btn=document.createElement('button'); btn.type='button';
        btn.className='chip'+(b.cls ? ' '+b.cls : ''); btn.textContent=b.label;
        btn.onclick=b.onClick; row.appendChild(btn);
      });
      div.appendChild(row);
    }
    chat.appendChild(div); scrollChat();
  }
  function cancelBtn(){
    return { label: R().cancel, cls: 'chip-cancel', onClick: function(){ addUser(R().cancel); cancelReport(); } };
  }
  function skipBtn(){
    return { label: R().skip, onClick: function(){ addUser(R().skip); skipStep(); } };
  }
  function typeButtons(){
    return R().types.map(function(t){
      return { label: t.label, onClick: (function(key){ return function(){ chooseType(key); }; })(t.key) };
    });
  }
  function startReport(){
    reportState={ step:'type', type:null, address:'', cross:'', pole:'', desc:'', contact:'' };
    addUser(R().entryChip);
    var btns=typeButtons(); btns.push(cancelBtn());
    addFlowMsg(R().safety+' '+R().askType, btns);
  }
  function cancelReport(){
    reportState=null;
    addBot({lead: R().cancelled, details:[], contact:[]});
  }
  function typeLabel(key){
    var all=STR.en.report.types.concat(STR.es.report.types);
    for (var i=0;i<R().types.length;i++) if (R().types[i].key===key) return R().types[i].label;
    for (var j=0;j<all.length;j++) if (all[j].key===key) return all[j].label;
    return key;
  }
  function chooseType(key){
    if (!reportState) return;
    reportState.type=key;
    addUser(typeLabel(key));
    reportState.step='address';
    addFlowMsg(R().askAddress, [cancelBtn()]);
  }
  function matchTypeText(text){
    var n=' '+normText(text)+' ';
    var langs=['en','es'];
    for (var li=0; li<langs.length; li++){
      var types=STR[langs[li]].report.types;
      for (var i=0;i<types.length;i++){
        if (n.indexOf(' '+normText(types[i].label)+' ')!==-1 || n.indexOf(' '+types[i].key+' ')!==-1) return types[i].key;
      }
    }
    return null;
  }
  function advanceAfterCross(){
    if (reportState.type==='streetlight'){
      reportState.step='pole';
      addFlowMsg(R().askPole, [skipBtn(), cancelBtn()]);
    } else {
      reportState.step='desc';
      addFlowMsg(R().askDesc, [cancelBtn()]);
    }
  }
  function skipStep(){
    if (!reportState) return;
    if (reportState.step==='pole'){
      reportState.step='desc';
      addFlowMsg(R().askDesc, [cancelBtn()]);
    } else if (reportState.step==='contact'){
      finishReport();
    }
  }
  function handleFlowText(text){
    var st=reportState; if (!st) return;
    addUser(text);
    if (st.step==='type'){
      var key=matchTypeText(text);
      if (key){
        st.type=key; st.step='address';
        addFlowMsg(R().askAddress, [cancelBtn()]);
      } else {
        var btns=typeButtons(); btns.push(cancelBtn());
        addFlowMsg(R().typeRetry, btns);
      }
    } else if (st.step==='address'){
      st.address=text; st.step='cross';
      addFlowMsg(R().askCross, [cancelBtn()]);
    } else if (st.step==='cross'){
      st.cross=text; advanceAfterCross();
    } else if (st.step==='pole'){
      st.pole=text; st.step='desc';
      addFlowMsg(R().askDesc, [cancelBtn()]);
    } else if (st.step==='desc'){
      st.desc=text; st.step='contact';
      addFlowMsg(R().askContact, [skipBtn(), cancelBtn()]);
    } else if (st.step==='contact'){
      st.contact=text; finishReport();
    }
  }
  function copyText(text, btn){
    function ok(){ btn.textContent=R().copied; }
    function fail(){ btn.textContent=R().copyFail; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(ok, function(){
        if (!legacyCopy(text)) fail(); else ok();
      });
    } else if (!legacyCopy(text)) fail(); else ok();
  }
  function legacyCopy(text){
    try {
      var ta=document.createElement('textarea');
      ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      var done=document.execCommand('copy');
      ta.remove(); return done;
    } catch (e) { return false; }
  }
  function finishReport(){
    var st=reportState; reportState=null;
    var dept=R().depts[st.type] || R().depts.other;
    var rows=[[R().fIssue, typeLabel(st.type)], [R().fLocation, st.address], [R().fCross, st.cross]];
    if (st.pole) rows.push([R().fPole, st.pole]);
    rows.push([R().fDesc, st.desc]);
    if (st.contact) rows.push([R().fContact, st.contact]);
    var div=document.createElement('div'); div.className='msg bot report-card';
    var html='<div class="rc-title">'+esc(R().summaryTitle)+'</div><div class="report-rows">';
    rows.forEach(function(r){ html+='<div><strong>'+esc(r[0])+':</strong> '+esc(r[1])+'</div>'; });
    html+='</div>';
    html+='<div class="rc-call"><div>'+esc(R().callLine)+'</div><div><strong>'+esc(dept.label)+':</strong> <a href="tel:+1'+dept.phone.replace(/-/g,'')+'">'+esc(dept.phone)+'</a></div></div>';
    html+='<div class="rc-note">'+esc(R().notSent)+'</div>';
    div.innerHTML=html;
    var plain=[R().copyHead]
      .concat(rows.map(function(r){ return r[0]+': '+r[1]; }))
      .concat([R().callLine+' '+dept.label+': '+dept.phone, R().notSent])
      .join('\n');
    var row=document.createElement('div'); row.className='flowbtns';
    var cb=document.createElement('button'); cb.type='button'; cb.className='chip'; cb.textContent=R().copy;
    cb.onclick=function(){ copyText(plain, cb); };
    row.appendChild(cb); div.appendChild(row);
    if (voice.synthOK) attachSpeak(div, plain.replace(/\n/g,' '), lang);
    chat.appendChild(div); scrollChat();
  }
</script>

<script>
  /* ---------- voice: microphone input + read-aloud ----------
     Both features are feature-detected. When an API is missing, its
     control is never created and the page behaves exactly as before.
     Dictation fills the same composer input and goes through the same
     form submit path as typing, so it works inside the report flow too. */
  var MIC_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>';
  var SPEAK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
  var STOP_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>';
  var voice = {
    SR: window.SpeechRecognition || window.webkitSpeechRecognition || null,
    synthOK: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window),
    rec: null, listening: false, micBtn: null, hint: null, enc: null, speakState: null,
    msg: null, gotFinal: false, anyResult: false, pendingMsg: null, msgShown: false,
    userStopped: false, timer: null, voiceList: null
  };
  function showVoiceMsg(text){
    if (!voice.msg) return;
    voice.msg.textContent=text;
    voice.msg.classList.add('on');
    voice.msgShown=true;
  }
  function hideVoiceMsg(){
    if (!voice.msg) return;
    voice.msg.classList.remove('on');
    voice.msgShown=false;
  }
  function initVoice(){
    if (!voice.SR) return;
    var form=document.getElementById('askform');
    var bar=document.createElement('div');
    bar.className='voicebar'; bar.id='voicebar';
    var btn=document.createElement('button');
    btn.type='button'; btn.id='micbtn'; btn.className='mic';
    btn.innerHTML=MIC_SVG+'<span class="mic-label">'+esc(STR[lang].voice.mic)+'</span>';
    btn.setAttribute('aria-label', STR[lang].voice.mic);
    btn.setAttribute('aria-pressed', 'false');
    bar.appendChild(btn);
    var enc=document.createElement('span');
    enc.className='voice-enc'; enc.id='voice-enc';
    enc.textContent=STR[lang].voice.encourage;
    bar.appendChild(enc);
    form.parentNode.insertBefore(bar, form);
    voice.micBtn=btn;
    voice.enc=enc;
    var hint=document.createElement('div');
    hint.id='voicehint'; hint.className='voicehint'; hint.setAttribute('aria-live', 'polite');
    hint.textContent=STR[lang].voice.listening;
    form.parentNode.appendChild(hint);
    voice.hint=hint;
    var msg=document.createElement('div');
    msg.id='voicemsg'; msg.className='voicemsg'; msg.setAttribute('aria-live', 'polite');
    form.parentNode.appendChild(msg);
    voice.msg=msg;
    document.getElementById('q').addEventListener('input', hideVoiceMsg);
    form.addEventListener('submit', hideVoiceMsg);
    btn.onclick=toggleMic;
  }
  function setListening(on){
    voice.listening=on;
    if (voice.micBtn){
      voice.micBtn.classList.toggle('listening', on);
      voice.micBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    if (voice.hint) voice.hint.classList.toggle('on', on);
  }
  function toggleMic(){
    if (!voice.SR) return;
    if (voice.listening && voice.rec){
      voice.userStopped=true;
      try { voice.rec.stop(); } catch (e) {}
      return;
    }
    hideVoiceMsg();
    var rec;
    try { rec=new voice.SR(); } catch (e) { return; }
    voice.rec=rec;
    voice.gotFinal=false;
    voice.anyResult=false;
    voice.pendingMsg=null;
    voice.msgShown=false;
    voice.userStopped=false;
    rec.lang = lang==='es' ? 'es-US' : 'en-US';
    rec.interimResults=true;
    rec.maxAlternatives=1;
    rec.onresult=function(ev){
      voice.anyResult=true;
      var finalText='', interimText='';
      for (var i=0; i<ev.results.length; i++){
        if (ev.results[i].isFinal) finalText+=ev.results[i][0].transcript;
        else interimText+=ev.results[i][0].transcript;
      }
      var input=document.getElementById('q');
      finalText=finalText.trim();
      if (finalText){
        voice.gotFinal=true;
        input.value=finalText;
        autoGrow();
        var form=document.getElementById('askform');
        if (form.requestSubmit) form.requestSubmit();
        else { ask(input.value); input.value=''; autoGrow(); }
      } else if (interimText){
        input.value=interimText;
        autoGrow();
      }
    };
    rec.onerror=function(ev){
      var kind=ev && ev.error ? ev.error : '';
      if (kind==='not-allowed' || kind==='service-not-allowed') voice.pendingMsg=STR[lang].voice.blocked;
      else if (kind==='network') voice.pendingMsg=STR[lang].voice.network;
      else voice.pendingMsg=STR[lang].voice.nohear;
      setListening(false);
      if (!voice.gotFinal && !voice.userStopped && !voice.msgShown) showVoiceMsg(voice.pendingMsg);
    };
    rec.onend=function(){
      if (voice.timer){ clearTimeout(voice.timer); voice.timer=null; }
      setListening(false);
      if (!voice.gotFinal && !voice.userStopped && !voice.msgShown){
        showVoiceMsg(voice.pendingMsg || STR[lang].voice.nohear);
      }
      voice.pendingMsg=null;
    };
    try {
      rec.start();
      setListening(true);
      voice.timer=setTimeout(function(){
        voice.timer=null;
        if (voice.listening && !voice.anyResult && voice.rec===rec){
          try { rec.stop(); } catch (e) {}
        }
      }, 10000);
    } catch (e) { setListening(false); }
  }
  function refreshVoices(){
    if (!voice.synthOK) return;
    try {
      var vs=window.speechSynthesis.getVoices();
      if (vs) voice.voiceList=vs;
    } catch (e) {}
  }
  if (voice.synthOK){
    refreshVoices();
    try {
      if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
      else window.speechSynthesis.onvoiceschanged=refreshVoices;
    } catch (e) {}
  }
  var VOICE_NATURAL=['google','premium','enhanced','natural','neural'];
  var VOICE_GOOD={
    en: ['samantha','ava','allison','susan','zira','jenny','aria'],
    es: ['mónica','monica','paulina','jorge','juan','sabina']
  };
  var VOICE_AVOID=['albert','bells','cellos','whisper','zarvox','trinoids','boing','bubbles','bad news','good news','deranged','hysterical','pipe organ','fred','junior','ralph','kathy','vicki','princess','bruce','wobble'];
  function nameHas(name, list){
    for (var i=0;i<list.length;i++){ if (name.indexOf(list[i])>=0) return true; }
    return false;
  }
  function pickVoice(speakLang){
    try {
      var voices=(voice.voiceList && voice.voiceList.length) ? voice.voiceList : null;
      if (!voices){
        refreshVoices();
        voices=voice.voiceList || [];
      }
      var prefix=speakLang, best=null, bestTier=99, bestLocale=99;
      for (var i=0;i<voices.length;i++){
        var vl=(voices[i].lang || '').toLowerCase().replace(/_/g, '-');
        if (vl.indexOf(prefix)!==0) continue;
        var name=(voices[i].name || '').toLowerCase();
        var tier;
        if (nameHas(name, VOICE_NATURAL)) tier=0;
        else if (nameHas(name, VOICE_GOOD[prefix] || [])) tier=1;
        else if (!nameHas(name, VOICE_AVOID)) tier=2;
        else tier=3;
        var locale=(vl===prefix+'-us') ? 0 : 1;
        if (tier<bestTier || (tier===bestTier && locale<bestLocale)){
          best=voices[i]; bestTier=tier; bestLocale=locale;
        }
      }
      return best;
    } catch (e) { return null; }
  }
  function resetSpeakBtn(btn, speakLang){
    btn.classList.remove('speaking');
    btn.innerHTML=SPEAK_SVG+'<span>'+esc(STR[speakLang].voice.listen)+'</span>';
    btn.setAttribute('aria-label', STR[speakLang].voice.listen);
  }
  function stopSpeak(){
    if (voice.synthOK) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    if (voice.speakState){
      var st=voice.speakState; voice.speakState=null;
      resetSpeakBtn(st.btn, st.lang);
    }
  }
  function attachSpeak(div, text, answerLang){
    if (!voice.synthOK || !text) return;
    var speakLang = answerLang==='es' ? 'es' : (answerLang==='en' ? 'en' : lang);
    var btn=document.createElement('button');
    btn.type='button'; btn.className='speakbtn';
    btn.innerHTML=SPEAK_SVG+'<span>'+esc(STR[speakLang].voice.listen)+'</span>';
    btn.setAttribute('aria-label', STR[speakLang].voice.listen);
    btn.onclick=function(){
      if (voice.speakState && voice.speakState.btn===btn){ stopSpeak(); return; }
      stopSpeak();
      var utt=new SpeechSynthesisUtterance(text);
      utt.lang = speakLang==='es' ? 'es-US' : 'en-US';
      utt.rate=1.08;
      utt.pitch=1.0;
      var v=pickVoice(speakLang); if (v) utt.voice=v;
      voice.speakState={ btn: btn, lang: speakLang };
      btn.classList.add('speaking');
      btn.innerHTML=STOP_SVG+'<span>'+esc(STR[speakLang].voice.stop)+'</span>';
      btn.setAttribute('aria-label', STR[speakLang].voice.stop);
      utt.onend=utt.onerror=function(){
        if (voice.speakState && voice.speakState.btn===btn){
          voice.speakState=null; resetSpeakBtn(btn, speakLang);
        }
      };
      window.speechSynthesis.speak(utt);
    };
    div.appendChild(btn);
  }

  function ask(text){
    var q=(text||'').trim(); if(!q) return;
    if (reportState){ handleFlowText(q); return; }
    addUser(q);
    var btn=document.getElementById('sendbtn'); btn.disabled=true;
    var thinking=document.createElement('div'); thinking.className='msg bot'; thinking.textContent=STR[lang].thinking;
    chat.appendChild(thinking); scrollChat();
    fetch('/api/ask', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:q, lang:lang}) })
      .then(function(r){ return r.json(); })
      .then(function(data){ thinking.remove(); addBot(data); })
      .catch(function(){ thinking.remove(); addBot({lead: lang==='es' ? 'Lo siento, algo salió mal. Llame a la Mesa de Ayuda del municipio al 201-875-9110.' : 'Sorry, something went wrong. Please call the Township Help Desk at 201-875-9110.', details:[], contact:[]}); })
      .finally(function(){ btn.disabled=false; });
  }
  /* ---------- composer: multi-line textarea with auto-grow ---------- */
  var qEl=document.getElementById('q');
  function autoGrow(){
    qEl.style.height='auto';
    var max=120;
    qEl.style.height=Math.min(qEl.scrollHeight, max)+'px';
    qEl.style.overflowY=qEl.scrollHeight>max ? 'auto' : 'hidden';
  }
  qEl.addEventListener('input', autoGrow);
  qEl.addEventListener('keydown', function(e){
    if (e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      var form=document.getElementById('askform');
      if (form.requestSubmit) form.requestSubmit();
      else form.dispatchEvent(new Event('submit', { cancelable: true }));
    }
  });
  document.getElementById('askform').addEventListener('submit', function(e){
    e.preventDefault();
    var input=document.getElementById('q'); ask(input.value); input.value=''; autoGrow();
  });
  document.getElementById('btn-en').onclick=function(){ lang='en'; applyLang(); };
  document.getElementById('btn-es').onclick=function(){ lang='es'; applyLang(); };
  applyLang();
  initVoice();
  addBot({lead: STR.en.greeting, details:[], contact:[]});
</script>
</body>
</html>
